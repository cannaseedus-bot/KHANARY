<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>K'UHUL STUDIO ⟁</title>
<meta name="theme-color" content="#070a0f"/>
<link rel="manifest" href="kuhul-studio.webmanifest"/>
<link rel="icon" href="kuhul-icon.svg" type="image/svg+xml"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --obs:#070a0f; --obs2:#0b1018; --slab:#0e151f; --slab2:#121b28;
  --edge:#1d2b3a; --jade:#3ee6c4; --jade2:#1f8f7c; --gold:#e8a04b;
  --violet:#b47cff; --rose:#ff5d73; --ink:#c9d6dd; --dim:#6b7d8a; --faint:#3c4c58;
  --mono:'JetBrains Mono',monospace; --disp:'Chakra Petch',var(--mono);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--obs);color:var(--ink);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased}

.app{height:100vh;display:grid;
  grid-template-columns:210px 1fr 340px;
  grid-template-rows:50px 1fr 24px}

/* topbar */
.topbar{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(180deg,var(--slab),var(--obs2));border-bottom:1px solid var(--edge)}
.brand{display:flex;align-items:center;gap:9px}
.sigil{width:28px;height:28px;flex-shrink:0}
.ring{animation:spin 26s linear infinite;transform-origin:50% 50%}
.ring2{animation:spin 18s linear infinite reverse;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.brand-name{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:3px;text-transform:uppercase}
.brand-name b{color:var(--jade)}
.ts{flex:1}
.pill{font-size:11px;padding:3px 9px;border:1px solid var(--edge);border-radius:999px;
  color:var(--dim);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.pill.live .dot{background:var(--jade);animation:pulse 2s infinite}
.pill.dead .dot{background:var(--rose)}
.pill b{color:var(--jade)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(62,230,196,.5)}50%{box-shadow:0 0 0 4px rgba(62,230,196,0)}}
.pbtn{font-family:var(--disp);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  padding:4px 11px;border:1px solid var(--edge);border-radius:999px;cursor:pointer;
  color:var(--violet);background:rgba(180,124,255,.08);transition:.15s}
.pbtn:hover{color:var(--obs);background:var(--violet);border-color:var(--violet)}

/* left rail */
.rail{background:linear-gradient(180deg,var(--obs2),var(--obs));border-right:1px solid var(--edge);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.rail-head{padding:10px 10px 6px;display:flex;align-items:center;justify-content:space-between}
.rlbl{font-family:var(--disp);font-size:10px;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase}
.nbtn{font-size:14px;color:var(--obs);background:var(--jade);border:none;
  width:20px;height:20px;border-radius:4px;cursor:pointer;transition:.15s;line-height:1}
.nbtn:hover{transform:rotate(90deg)}
.projects{flex:1;overflow-y:auto;padding:2px 5px 8px}
.proj{display:flex;gap:7px;align-items:flex-start;padding:7px 7px;border-radius:6px;
  cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:.12s}
.proj:hover{background:rgba(30,43,58,.5)}
.proj.active{background:rgba(62,230,196,.08);border-color:rgba(62,230,196,.28)}
.proj .gy{color:var(--jade2);font-size:12px;margin-top:1px}
.proj.active .gy{color:var(--jade)}
.proj .meta{min-width:0;flex:1}
.proj .nm{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .sub{font-size:10px;color:var(--faint);letter-spacing:.5px}
.proj .x{opacity:0;color:var(--faint);font-size:11px;cursor:pointer}
.proj:hover .x{opacity:1}
.proj .x:hover{color:var(--rose)}
.rail-ft{padding:8px 10px;border-top:1px solid var(--edge);font-size:10px;color:var(--faint);letter-spacing:1px;line-height:1.7}
.rail-ft b{color:var(--dim)}

/* workspace: monaco + tabs */
.workspace{display:flex;flex-direction:column;min-height:0;overflow:hidden;
  background:var(--obs);border-right:1px solid var(--edge)}
.tabbar{display:flex;align-items:stretch;background:var(--obs2);border-bottom:1px solid var(--edge);
  overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:0 12px;font-size:11px;
  color:var(--dim);background:transparent;border:none;border-right:1px solid var(--edge);
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:var(--mono);
  transition:.1s;min-height:34px}
.tab:hover{color:var(--ink);background:rgba(30,43,58,.4)}
.tab.active{color:var(--jade);background:rgba(62,230,196,.06);border-bottom-color:var(--jade)}
.tab .tx{font-size:12px;color:var(--faint);opacity:0;transition:.1s;cursor:pointer}
.tab:hover .tx{opacity:1}
.tab .tx:hover{color:var(--rose)}
.prevbtn{margin-left:auto;padding:0 12px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--dim);background:transparent;border:none;border-left:1px solid var(--edge);
  cursor:pointer;font-family:var(--disp);white-space:nowrap;transition:.1s}
.prevbtn:hover{color:var(--jade)}
.prevbtn.on{color:var(--jade);background:rgba(62,230,196,.06)}
.ewrap{flex:1;min-height:0;position:relative}
#mnt{position:absolute;inset:0}
.eempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;color:var(--faint);font-size:11px;letter-spacing:1px;
  pointer-events:none;z-index:2}
.eempty .big{font-family:var(--disp);font-size:20px;letter-spacing:5px;color:var(--dim);text-transform:uppercase}
.pwrap{flex:1;min-height:0;background:#fff;display:none}
.pwrap iframe{width:100%;height:100%;border:none}

/* chat panel */
.cpanel{display:flex;flex-direction:column;min-height:0;overflow:hidden;
  background:linear-gradient(180deg,var(--obs2),var(--obs))}
.chead{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-shrink:0;
  border-bottom:1px solid var(--edge);background:linear-gradient(180deg,var(--slab),var(--obs2))}
.chead .lbl{font-family:var(--disp);font-size:10px;letter-spacing:2.5px;color:var(--violet);text-transform:uppercase}
.chead .sp{flex:1}
.cstream{flex:1;overflow-y:auto;padding:12px 12px 8px;min-height:0}
.cempty{height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;color:var(--faint);text-align:center}
.cempty .gs{display:flex;gap:10px;font-size:18px;color:var(--jade2);opacity:.7}
.cempty .gs span{animation:bob 3s ease-in-out infinite}
.cempty .gs span:nth-child(2){animation-delay:.3s;color:var(--gold)}
.cempty .gs span:nth-child(3){animation-delay:.6s;color:var(--violet)}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}
.cempty p{font-size:11px;letter-spacing:.3px;max-width:220px;line-height:1.7;color:var(--faint)}

.msg{margin-bottom:12px;animation:rise .22s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.mglyph{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;font-size:11px;font-weight:700}
.msg.user .mglyph{background:rgba(62,230,196,.12);color:var(--jade);border:1px solid rgba(62,230,196,.3)}
.msg.bot  .mglyph{background:rgba(180,124,255,.12);color:var(--violet);border:1px solid rgba(180,124,255,.3)}
.msg.err  .mglyph{background:rgba(255,93,115,.12);color:var(--rose);border:1px solid rgba(255,93,115,.3)}
.mwho{font-family:var(--disp);font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
.msg.user .mwho{color:var(--jade)}
.msg.bot  .mwho{color:var(--violet)}
.msg.err  .mwho{color:var(--rose)}
.mts{font-size:10px;color:var(--faint);letter-spacing:1px}
.mbody{color:var(--ink);font-size:12px;padding-left:25px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.mbody code{background:var(--slab2);padding:1px 5px;border-radius:3px;color:var(--gold);font-size:11px}
.fchip{display:inline-flex;align-items:center;gap:4px;margin:2px 0 2px 25px;
  padding:2px 8px;background:rgba(62,230,196,.07);border:1px solid rgba(62,230,196,.2);
  border-radius:4px;font-size:10.5px;color:var(--jade);cursor:pointer;transition:.1s}
.fchip:hover{background:rgba(62,230,196,.15)}
.typing{display:inline-flex;gap:4px;align-items:center;padding-left:25px;margin-top:3px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--violet);
  display:inline-block;animation:tp 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-5px);opacity:1}}

/* chat input */
.cinput{padding:8px 10px 10px;border-top:1px solid var(--edge);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}
.chip{font-size:10px;color:var(--dim);background:rgba(30,43,58,.5);border:1px solid var(--edge);
  border-radius:999px;padding:3px 9px;cursor:pointer;transition:.12s;display:flex;gap:4px}
.chip .g{color:var(--jade2)}
.chip:hover{color:var(--ink);border-color:var(--jade2);background:rgba(62,230,196,.07)}
.chip:hover .g{color:var(--jade)}
.cwrap{display:flex;gap:7px;align-items:flex-end;background:var(--obs);
  border:1px solid var(--edge);border-radius:9px;padding:7px 7px 7px 11px;transition:.15s}
.cwrap:focus-within{border-color:var(--jade2);box-shadow:0 0 0 2px rgba(62,230,196,.07)}
.cglyph{color:var(--jade);font-size:13px;padding-bottom:3px;user-select:none}
#cmd{flex:1;background:transparent;border:none;resize:none;color:var(--ink);
  font-family:var(--mono);font-size:12.5px;line-height:1.5;max-height:120px;min-height:20px;outline:none}
#cmd::placeholder{color:var(--faint)}
.sbtn{font-family:var(--disp);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--obs);background:var(--jade);border:none;border-radius:6px;padding:6px 12px;
  cursor:pointer;transition:.15s;box-shadow:0 0 12px rgba(62,230,196,.2);white-space:nowrap}
.sbtn:hover{transform:translateY(-1px);box-shadow:0 0 18px rgba(62,230,196,.35)}
.sbtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.sbtn.stop{background:var(--rose);box-shadow:0 0 12px rgba(255,93,115,.2)}

/* statusbar */
.sbar{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 12px;
  background:var(--obs2);border-top:1px solid var(--edge);
  font-size:10px;letter-spacing:1px;color:var(--faint);text-transform:uppercase}
.sbar .s{display:flex;align-items:center;gap:5px}
.sbar b{color:var(--jade)}
.sbar .g{color:var(--gold)}
.sbar .sp{flex:1}

::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--jade2)}

/* profile modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:flex;align-items:center;justify-content:center}
.pmodal{background:var(--slab);border:1px solid var(--edge);border-radius:10px;
  width:700px;max-width:94vw;height:80vh;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--edge)}
.phead .lbl{font-family:var(--disp);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--jade)}
.phead .sp{flex:1}
.pmodal iframe{flex:1;border:none;background:var(--obs)}
</style>
</head>
<body>
<div class="app">

<header class="topbar">
  <div class="brand">
    <svg class="sigil" viewBox="0 0 40 40" fill="none">
      <circle class="ring" cx="20" cy="20" r="17.5" stroke="#1f8f7c" stroke-width="1" stroke-dasharray="4 5"/>
      <polygon class="ring2" points="20,5 33,27 7,27" stroke="#3ee6c4" stroke-width="1.4" fill="none"/>
      <circle cx="20" cy="20" r="6.5" stroke="#e8a04b" stroke-width="1.4" fill="none"/>
      <circle cx="20" cy="20" r="2.2" fill="#3ee6c4"/>
      <path d="M20 8v6M20 26v6M8 20h6M26 20h6" stroke="#b47cff" stroke-width="1.2"/>
    </svg>
    <div class="brand-name">K'<b>UHUL</b> STUDIO</div>
  </div>
  <div class="ts"></div>
  <button class="pbtn" id="profileBtn">⚙ profile</button>
  <div class="pill dead" id="connPill"><span class="dot"></span><span id="connTxt">offline</span></div>
  <div class="pill" id="modelPill"><span class="dot" style="background:var(--gold)"></span>model <b id="modelName">…</b></div>
</header>

<aside class="rail">
  <div class="rail-head">
    <span class="rlbl">◈ projects</span>
    <button class="nbtn" id="newProj" title="new project">+</button>
  </div>
  <div class="projects" id="projList"></div>
  <div class="rail-ft"><b>FLASH RAM</b> · local<br/><span id="projCount">0</span> projects</div>
</aside>

<div class="workspace">
  <div class="tabbar" id="tabbar">
    <button class="prevbtn" id="prevBtn">▶ preview</button>
  </div>
  <div class="ewrap" id="ewrap">
    <div id="mnt"></div>
    <div class="eempty" id="eempty">
      <div class="big">⟁ canvas</div>
      <span>model writes here</span>
    </div>
  </div>
  <div class="pwrap" id="pwrap">
    <iframe id="prevFrame" sandbox="allow-scripts allow-modals"></iframe>
  </div>
</div>

<div class="cpanel">
  <div class="chead">
    <span class="lbl">⟁ k'uhul fabric</span>
    <span class="sp"></span>
    <span id="ctxLbl" style="font-size:10px;color:var(--faint)">ctx 0</span>
  </div>
  <div class="cstream" id="stream">
    <div class="cempty" id="cempty">
      <div class="gs"><span>⟁</span><span>◈</span><span>π</span></div>
      <p>Describe what to build. The model writes code directly to the canvas.</p>
    </div>
  </div>
  <div class="cinput">
    <div class="chips" id="chips"></div>
    <div class="cwrap">
      <span class="cglyph">⟁</span>
      <textarea id="cmd" rows="1" placeholder="describe what to build…  ⏎ send · ⇧⏎ newline"></textarea>
      <button class="sbtn" id="send">forge</button>
    </div>
  </div>
</div>

<footer class="sbar">
  <div class="s">⟁ <b id="stProj">no project</b></div>
  <div class="s">file <span class="g" id="stFile">—</span></div>
  <div class="s">out <span class="g" id="stOut">0</span> tok</div>
  <div class="sp"></div>
  <div class="s" id="stEp">endpoint …</div>
  <div class="s">K'UHUL · MX-2</div>
</footer>

</div>

<div id="profileModal" class="overlay" style="display:none">
  <div class="pmodal">
    <div class="phead">
      <span class="lbl">⚙ profile · agent forge</span>
      <span class="sp"></span>
      <button class="chip" id="pmClose">close</button>
    </div>
    <iframe id="profileFrame" src="user-profile.html" title="profile"></iframe>
  </div>
</div>

<script src="monaco/vs/loader.js"></script>
<script>
const API_BASE = location.protocol === 'https:' ? 'https://api.kuhul.dev' : 'http://127.0.0.1:8764';
const LS_KEY   = 'kuhul_studio_v2';
const PROF_KEY = 'kuhul_user_profile_v1';

const SYSTEM_PROMPT =
  "You are K'UHUL, a vibe-coding intelligence. " +
  "Write each file as a fenced code block with the filename after the language tag: " +
  "\\`\\`\\`html index.html\\n...\\`\\`\\`. " +
  "For web apps produce index.html (self-contained with inline CSS+JS when small), " +
  "and separate style.css / script.js when the app warrants it. " +
  "Files appear as tabs in the Monaco canvas. Keep prose minimal — ship working code.";

const QUICK = [
  ['◈','dashboard','a dark analytics dashboard with metric cards and a chart'],
  ['⧉','login','a glowing login form with jade submit and field validation'],
  ['π','data table','a searchable sortable data table with mock user rows'],
  ['◇','pricing','3-tier pricing card grid with a highlighted pro plan'],
  ['⟁','terminal','a fake neon terminal that types boot text on load'],
];

const $ = id => document.getElementById(id);

const langFromExt = name => ({
  html:'html',css:'css',js:'javascript',ts:'typescript',tsx:'typescript',
  jsx:'javascript',py:'python',json:'json',md:'markdown',xml:'xml',svg:'xml',
  sh:'shell',bat:'bat',cpp:'cpp',cs:'csharp',c:'c'
})[name.split('.').pop().toLowerCase()] || 'plaintext';

const inferName = lang => ({
  html:'index.html',css:'style.css',js:'script.js',javascript:'script.js',
  typescript:'main.ts',python:'main.py',json:'data.json',markdown:'README.md'
})[lang.toLowerCase()] || `file.${lang}`;

/* ── API ── */
const api = {
  async get(path) {
    const r = await fetch(`${API_BASE}${path}`);
    if (r.status === 401) { window.location.href = `${API_BASE}/auth/google`; }
    return r.json();
  },
  async post(path, body) {
    const r = await fetch(`${API_BASE}${path}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (r.status === 401) { window.location.href = `${API_BASE}/auth/google`; }
    return r.json();
  },
  async delete(path) {
    const r = await fetch(`${API_BASE}${path}`, { method: 'DELETE' });
    if (r.status === 401) { window.location.href = `${API_BASE}/auth/google`; }
    return r.json();
  }
};

/* ── state ── */
let state = { projects: [], activeId: null };
const activeProj = () => state.projects.find(p => p.id === state.activeId);

async function loadProjects() {
  state.projects = await api.get('/api/projects');
  if (state.projects.length && !state.activeId) state.activeId = state.projects[0].id;
  renderProjects();
}

async function loadFiles() {
  const ap = activeProj();
  files = []; activeFile = null; prevMode = false;
  if (ap) {
    const remoteFiles = await api.get(`/api/files/${ap.id}`);
    remoteFiles.forEach(f => {
      files.push({ ...f, id: f.id || 'f' + Date.now().toString(36) });
    });
    activeFile = files[0]?.id || null;
    if (activeFile) {
      const f = files.find(f => f.id === activeFile);
      setEditorContent(f.lang, f.content);
      $('stFile').textContent = f.name;
      $('eempty').style.display = 'none';
    }
  } else {
    editor?.getModel()?.setValue('');
    $('eempty').style.display = 'flex'; $('stFile').textContent = '—';
  }
  renderTabs();
}

async function newProject(title) {
  const p = await api.post('/api/projects', { title });
  state.projects.unshift({ id: p.id, title: title || 'untitled fabric', updated: Date.now(), messages: [] });
  state.activeId = p.id;
  files = []; activeFile = null; prevMode = false;
  editor?.getModel()?.setValue('');
  $('eempty').style.display = 'flex'; $('stFile').textContent = '—';
  await loadProjects(); renderStream();
  return p;
}

async function deleteProject(id, e) {
  e?.stopPropagation();
  await api.delete(`/api/projects/${id}`);
  state.projects = state.projects.filter(p => p.id !== id);
  if (state.activeId === id) state.activeId = state.projects[0]?.id || null;
  await loadProjects(); renderStream(); loadFiles();
}

/* ── file / tab state ── */
let files = [];         // [{id,name,lang,content}]
let activeFile = null;  // id
let prevMode = false;
let editor = null;

function setEditorContent(lang, content) {
  if (!editor) return;
  const m = editor.getModel();
  if (!m) return;
  monaco.editor.setModelLanguage(m, lang);
  m.setValue(content);
}

function switchFile(id) {
  prevMode = false;
  activeFile = id;
  const f = files.find(f => f.id === id);
  $('ewrap').style.display = 'block';
  $('pwrap').style.display  = 'none';
  $('prevBtn').classList.remove('on');
  if (f) {
    setEditorContent(f.lang, f.content);
    $('stFile').textContent = f.name;
    $('eempty').style.display = 'none';
  }
  renderTabs();
}

async function addOrUpdateFile(name, lang, content) {
  const ap = activeProj();
  if (!ap) return;
  
  const ex = files.find(f => f.name === name);
  if (ex) {
    ex.content = content; ex.lang = lang;
    if (activeFile === ex.id && !prevMode) setEditorContent(lang, content);
    renderTabs();
    await api.post('/api/files', { projectId: ap.id, name, lang, content });
    return ex.id;
  }
  
  const f = { id: 'f' + Date.now().toString(36), name, lang, content };
  files.push(f);
  renderTabs();
  switchFile(f.id);
  await api.post('/api/files', { projectId: ap.id, name, lang, content });
  return f.id;
}

function closeFile(id) {
  files = files.filter(f => f.id !== id);
  if (activeFile === id) {
    activeFile = files[0]?.id || null;
    if (activeFile) switchFile(activeFile);
    else { $('stFile').textContent = '—'; $('eempty').style.display = 'flex'; editor?.getModel()?.setValue(''); }
  }
  renderTabs();
}

function renderTabs() {
  const bar = $('tabbar');
  bar.querySelectorAll('.tab').forEach(t => t.remove());
  const pb = $('prevBtn');
  files.forEach(f => {
    const t = document.createElement('button');
    t.className = 'tab' + (f.id === activeFile && !prevMode ? ' active' : '');
    t.innerHTML = `<span>${f.name}</span><span class="tx" data-id="${f.id}">×</span>`;
    t.onclick = () => switchFile(f.id);
    t.querySelector('.tx').onclick = e => { e.stopPropagation(); closeFile(f.id); };
    bar.insertBefore(t, pb);
  });
}

function showPreview() {
  const html = files.find(f => f.lang === 'html') || files[0];
  if (!html) return;
  prevMode = true; activeFile = null;
  $('ewrap').style.display  = 'none';
  $('pwrap').style.display  = 'block';
  $('prevBtn').classList.add('on');
  $('prevFrame').srcdoc = html.content;
  renderTabs();
}

$('prevBtn').onclick = () => prevMode ? switchFile(files[0]?.id) : showPreview();

function renderProjects() {
  const list = $('projList'); list.innerHTML = '';
  $('projCount').textContent = state.projects.length;
  state.projects.forEach(p => {
    const ago = t => { const s = (Date.now()-t)/1000; if(s<60) return 'now'; if(s<3600) return Math.floor(s/60)+'m'; if(s<86400) return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d'; };
    const d = document.createElement('div');
    d.className = 'proj' + (p.id === state.activeId ? ' active' : '');
    d.innerHTML = `<span class="gy">⟁</span><div class="meta"><div class="nm"></div><div class="sub">${ago(p.updated || Date.now())} · ${p.messages?.length || 0} msg</div></div><span class="x">✕</span>`;
    d.querySelector('.nm').textContent = p.title;
    d.onclick = () => { state.activeId = p.id; renderProjects(); renderStream(); loadFiles(); };
    d.querySelector('.x').onclick = e => deleteProject(p.id, e);
    list.appendChild(d);
  });
  const ap = activeProj();
  $('stProj').textContent = ap ? ap.title : 'no project';
}

/* ── chat ── */
async function renderStream() {
  const ap = activeProj(); renderProjects();
  const s = $('stream'), empty = $('cempty');
  if (!ap) { s.innerHTML = ''; s.appendChild(empty); empty.style.display = 'flex'; $('ctxLbl').textContent = 'ctx 0'; return; }
  
  // We need to fetch messages for the project if not already loaded
  const msgs = await api.get(`/api/messages/${ap.id}`);
  
  if (!msgs || !msgs.length) { s.innerHTML = ''; s.appendChild(empty); empty.style.display = 'flex'; $('ctxLbl').textContent = 'ctx 0'; return; }
  empty.style.display = 'none'; s.innerHTML = '';
  msgs.forEach(m => s.appendChild(makeMsg(m.role, m.content, m.ts)));
  scrollDown();
  $('ctxLbl').textContent = 'ctx ' + msgs.length;
}

const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

function renderBody(container, text) {
  container.innerHTML = '';
  const blocks = [...text.matchAll(/```(\w+)(?:[ \t]+(\S+))?\n([\s\S]*?)```/g)];
  const parts  = text.split(/```[\s\S]*?```/g);
  parts.forEach((part, i) => {
    if (part.trim()) {
      const sp = document.createElement('span');
      sp.innerHTML = esc(part).replace(/`([^`]+)`/g, '<code>$1</code>');
      container.appendChild(sp);
    }
    if (blocks[i]) {
      const lang = blocks[i][1] || 'code';
      const fname = blocks[i][2] || inferName(lang);
      const chip = document.createElement('div');
      chip.className = 'fchip';
      chip.textContent = '⟁ ' + fname;
      chip.title = 'view in canvas';
      chip.onclick = () => { const f = files.find(f => f.name === fname); if (f) switchFile(f.id); };
      container.appendChild(chip);
    }
  });
}

const fmtT = t => new Date(t || Date.now()).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });

function makeMsg(role, content, ts) {
  const cls   = role === 'user' ? 'user' : role === 'error' ? 'err' : 'bot';
  const glyph = role === 'user' ? '◈' : role === 'error' ? '✕' : 'π';
  const who   = role === 'user' ? 'you' : role === 'error' ? 'fault' : "k'uhul";
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  d.innerHTML = `<div class="mhead"><span class="mglyph">${glyph}</span><span class="mwho">${who}</span><span class="mts">${fmtT(ts)}</span></div><div class="mbody"></div>`;
  renderBody(d.querySelector('.mbody'), content);
  return d;
}

const scrollDown = () => { const s = $('stream'); s.scrollTop = s.scrollHeight; };

/* ── code extraction ── */
function extractFiles(text) {
  const out = [];
  for (const m of text.matchAll(/```(\w+)(?:[ \t]+(\S+))?\n([\s\S]*?)```/g)) {
    out.push({ lang: m[1]||'text', name: m[2]||inferName(m[1]||'text'), content: m[3].trimEnd() });
  }
  return out;
}

/* ── model probe ── */
async function probeModel() {
  try {
    const r = await fetch(API_BASE + '/v1/models', { cache: 'no-store' });
    if (!r.ok) throw new Error();
    const j = await r.json();
    const id = j.data?.[0]?.id || 'unknown';
    $('modelName').textContent = id.replace(/\.gguf$/, '').slice(0, 22);
    $('connPill').className = 'pill live'; $('connTxt').textContent = 'linked';
    $('stEp').textContent = 'endpoint ' + API_BASE.replace(/^https?:\/\//, '');
  } catch {
    $('modelName').textContent = 'offline';
    $('connPill').className = 'pill dead'; $('connTxt').textContent = 'offline';
    $('stEp').textContent = 'endpoint ' + API_BASE.replace(/^https?:\/\//, '');
  }
}

/* ── send / stream ── */
let streaming = false, abort = null, outTok = 0;

async function send() {
  if (streaming) { abort?.abort(); return; }
  const text = $('cmd').value.trim(); if (!text) return;
  let ap = activeProj(); if (!ap) ap = await newProject(text.slice(0, 40));
  if (!ap.messages?.length) ap.title = text.slice(0, 40);

  $('cmd').value = ''; $('cmd').style.height = 'auto';
  $('cempty').style.display = 'none';
  $('stream').appendChild(makeMsg('user', text, Date.now())); scrollDown();

  const holder = document.createElement('div'); holder.className = 'msg bot';
  holder.innerHTML = `<div class="mhead"><span class="mglyph">π</span><span class="mwho">k'uhul</span><span class="mts">${fmtT()}</span></div><div class="typing"><i></i><i></i><i></i></div>`;
  $('stream').appendChild(holder); scrollDown();

  const prof = (() => { try { return JSON.parse(localStorage.getItem(PROF_KEY)||'null'); } catch { return null; } })();
  const samp = prof?.sampling || {};

  streaming = true; setSend(true);
  abort = new AbortController();

  // Replace the typing indicator with the live bot message body. Tokens
  // stream into it; renderBody() finalizes formatting (code chips) at the end.
  holder.innerHTML = `<div class="mhead"><span class="mglyph">π</span><span class="mwho">k'uhul</span><span class="mts">${fmtT()}</span></div><div class="mbody"></div>`;
  const msgBody = holder.querySelector('.mbody');
  const streamEl = document.createElement('span');
  msgBody.appendChild(streamEl);

  let full = '';      // accumulated assistant text
  let allText = '';   // raw bytes (fallback for non-SSE JSON replies)

  try {
    // Persist the user message, then rebuild history from the store so the
    // model gets a clean, deduplicated conversation.
    await api.post('/api/messages', { projectId: ap.id, role: 'user', content: text });
    const history = await api.get(`/api/messages/${ap.id}`);
    const msgs = [
      { role: 'system', content: prof?.system_message?.trim() || SYSTEM_PROMPT },
      ...history.map(m => ({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.content }))
    ];

    // The gateway's /v1/code route proxies to the active inference model
    // (active-model.json) with the vibe-coding system prompt. We ask for SSE
    // streaming and parse deltas so tokens render live; abort.signal lets the
    // halt button stop generation (the gateway tears down the upstream call).
    // Profile sampling (temperature / repeat penalty / last_n) is forwarded so
    // small models don't loop — the gateway passes unknown fields straight
    // through to llama.cpp.
    const reqBody = { projectId: ap.id, messages: msgs, stream: true };
    if (samp && typeof samp === 'object') {
      if (samp.temperature    !== undefined) reqBody.temperature    = samp.temperature;
      if (samp.repeat_penalty !== undefined) reqBody.repeat_penalty = samp.repeat_penalty;
      if (samp.repeat_last_n  !== undefined) reqBody.repeat_last_n  = samp.repeat_last_n;
    }
    const res = await fetch(API_BASE + '/v1/code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(reqBody),
      signal: abort.signal
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || ('HTTP ' + res.status));
    }
    if (!res.body) throw new Error('streaming not supported');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let sseBuffer = '';
    let doneFlag = false;
    while (!doneFlag) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      allText += chunk;
      sseBuffer += chunk;
      let nl;
      while ((nl = sseBuffer.indexOf('\n\n')) >= 0) {
        const raw = sseBuffer.slice(0, nl);
        sseBuffer = sseBuffer.slice(nl + 2);
        const line = raw.split('\n').map(l => l.trim()).find(l => l.startsWith('data:'));
        if (!line) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') { doneFlag = true; break; }
        try {
          const j = JSON.parse(payload);
          const c = j?.choices?.[0]?.delta?.content;
          if (c) { full += c; streamEl.textContent = full; scrollDown(); }
        } catch (_) {}
      }
    }

    // Fallback: some backends answer with a single JSON body instead of SSE.
    if (!full) {
      try { full = JSON.parse(allText)?.choices?.[0]?.message?.content || ''; } catch (_) {}
    }

    renderBody(msgBody, full);
    if (full) {
      extractFiles(full).forEach(f => addOrUpdateFile(f.name, f.lang, f.content));
      await api.post('/api/messages', { projectId: ap.id, role: 'bot', content: full });
    }
    await renderStream();
  } catch (e) {
    if (e && e.name === 'AbortError') {
      // User hit halt — keep whatever streamed in, mark the partial reply.
      renderBody(msgBody, full || '(halted)');
      if (full) await api.post('/api/messages', { projectId: ap.id, role: 'bot', content: full });
      await renderStream();
    } else {
      holder.className = 'msg err';
      holder.innerHTML = `<div class="mhead"><span class="mglyph">✕</span><span class="mwho">fault</span><span class="mts">${fmtT()}</span></div><div class="mbody"></div>`;
      renderBody(holder.querySelector('.mbody'), `Fabric error: ${e.message}`);
    }
  } finally {
    streaming = false; setSend(false); abort = null;
  }
}

const setSend = on => { const b = $('send'); b.classList.toggle('stop', on); b.textContent = on ? '■ halt' : 'forge'; };

/* ── chips ── */
function buildChips() {
  QUICK.forEach(([g, label, prompt]) => {
    const b = document.createElement('button'); b.className = 'chip';
    b.innerHTML = `<span class="g">${g}</span>${label}`;
    b.onclick = () => { $('cmd').value = prompt; $('cmd').focus(); autoGrow(); };
    $('chips').appendChild(b);
  });
}

const autoGrow = () => { const t = $('cmd'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; };
$('cmd').addEventListener('input', autoGrow);
$('cmd').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('send').onclick = send;
$('newProj').onclick = () => { newProject(); $('cmd').focus(); };
$('profileBtn').onclick = () => { $('profileModal').style.display = 'flex'; $('profileFrame').src = 'user-profile.html'; };
$('pmClose').onclick = () => { $('profileModal').style.display = 'none'; };
$('profileModal').onclick = e => { if (e.target === $('profileModal')) $('profileModal').style.display = 'none'; };

/* ── Monaco ── */
require.config({ paths: { vs: 'monaco/vs' } });
require(['vs/editor/editor.main'], () => {
  monaco.editor.defineTheme('kuhul', {
    base: 'vs-dark', inherit: true,
    rules: [
      { token: 'comment',         foreground: '3c4c58', fontStyle: 'italic' },
      { token: 'keyword',         foreground: 'b47cff' },
      { token: 'string',          foreground: '3ee6c4' },
      { token: 'number',          foreground: 'e8a04b' },
      { token: 'tag',             foreground: 'b47cff' },
      { token: 'attribute.name',  foreground: 'e8a04b' },
      { token: 'attribute.value', foreground: '3ee6c4' },
    ],
    colors: {
      'editor.background':              '#070a0f',
      'editor.foreground':              '#c9d6dd',
      'editorLineNumber.foreground':    '#3c4c58',
      'editorLineNumber.activeForeground': '#3ee6c4',
      'editor.selectionBackground':     '#1d2b3a',
      'editorCursor.foreground':        '#3ee6c4',
      'scrollbarSlider.background':     '#1d2b3a',
      'scrollbarSlider.hoverBackground':'#1f8f7c',
      'minimap.background':             '#0b1018',
      'editorWidget.background':        '#0b1018',
      'editorWidget.border':            '#1d2b3a',
    }
  });
  editor = monaco.editor.create($('mnt'), {
    value: '', language: 'html', theme: 'kuhul',
    readOnly: true,
    fontSize: 13, fontFamily: "'JetBrains Mono', monospace", lineHeight: 20,
    minimap: { enabled: true },
    scrollBeyondLastLine: false,
    renderLineHighlight: 'none',
    overviewRulerBorder: false,
    smoothScrolling: true,
    padding: { top: 10, bottom: 10 },
  });
  window.addEventListener('resize', () => editor.layout());
  loadProjects().then(loadFiles);
});

/* ── boot ── */
buildChips();
loadProjects().then(loadFiles);
if (!state.activeId && state.projects[0]) state.activeId = state.projects[0].id;
probeModel();
setInterval(probeModel, 15000);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
