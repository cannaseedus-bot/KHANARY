# AM-1 — SwarmConsciousness agent registration
# SwarmConsciousness::register_agent(json) reads [agent] as the config object.
# CSSBinding selector: 🤖[id="AM-1"] { --phase: ...; --load: ...; }

[agent]
id          = "AM-1"
type        = "adam"
fold        = "Sek"
port        = 3167
endpoint    = "http://localhost:3167"
swarm_role  = "adaptive_router"
priority    = 7
capabilities = ["generate", "evolve", "verify", "metrics", "bigram_routing"]
experts     = ["reasoning", "code", "math", "evolution", "proof"]

[hive]
swarm       = "versions/swarm-v0.1.0"
runtime     = "unified_swarm_runtime"
register_fn = "SwarmConsciousness::register_agent"
css_binding = true

[css]
selector  = "AM-1"
phase_var = "--adam-phase"
load_var  = "--adam-load"
role_var  = "--adam-role"

[_start]
lanes  = "native_glyph_engine_cli.exe AM-1.xjson"
fold   = "micronaut_xjson.exe AM-1.xjson"
worker = "adam.exe --port 3167 --mode fast"

[server]
name = "adam.@"
port = 3167
s7_base_url = "http://localhost:5000"
s7_role = "consumer"

[_description]
domain = "adaptive_inference"
description = "Autonomous Deterministic Adaptive Model — bigram/trigram routing with XML brain graph traversal"
capabilities = ["prompt_routing", "bigram_inference", "brain_graph_traversal", "confidence_scoring", "determinism_verification", "evolution_step"]

[_endpoints]
health  = "/health"
metrics = "/metrics"
query   = "/query"
analyze = "/analyze"
call    = "/call"
generate = "/generate"
evolve  = "/evolve"
verify  = "/verify"

[_s7_integration]
personality_source = "mm1-v2.4-native"
tool_routing = "adam-bigram-native"
evolution_enabled = true
personality_mode = "strict"
personality_file = "io/mm1_v2.4-final.json"

[_shards]
domain = "adaptive_inference"
shard_directory = "C:\\public_html\\MX2LM\\codex\\AS-XCFE\\artifacts\\shards\\adaptive_inference"
index_file = "shard-index.json"
compression = "zstd"

[_native]
exe = "adam.exe"
start_cmd = "adam.exe --port 3167 --mode fast"
brain_fast = "io/atomic-brain-fast.xml"
brain_deep = "io/atomic-brain-deep.xml"
vocab = "io/vocab.json"
bigrams = "io/bigrams.json"
trigrams = "io/trigrams.json"
xjson = "AM-1.xjson"
bots = "bots.py"
