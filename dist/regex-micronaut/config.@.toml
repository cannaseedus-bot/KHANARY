[server]
name = "regex.@"
port = 3171

[_description]
domain = "pattern_matching"
description = "Gram-fold regex µ — KXML token stream matching, schema validation, AIML pattern guards, corpus filtering"
capabilities = ["match","search","validate","findall","sub"]

[_endpoints]
health   = "/health"
match    = "/match"
search   = "/search"
validate = "/validate"
findall  = "/findall"

[_schemas]
kxml_token   = "^[⊗⊕⊖⊘⊛⊜⊝⊞]"
aiml_pattern = "^[A-Z0-9 _*#]+$"
port         = "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
semver       = "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"
sha256       = "^[0-9a-f]{64}$"

[_start]
lanes  = "native_glyph_engine_cli.exe --xjson REGEX-1.xjson --lanes"
server = "micronaut_xjson.exe --xjson REGEX-1.xjson --bots bots.py --port 3171"

[_native]
lane_engine = "native_glyph_engine_cli.exe"
lane_role   = "materializes @lanes — agent/skills/experts/runtime/router from REGEX-1.xjson"
server_exe  = "micronaut_xjson.exe"
server_role = "JSON server worker — HTTP :3171, action dispatcher → bots.py::dispatch(task, payload)"
xjson       = "REGEX-1.xjson"
bots        = "bots.py"
