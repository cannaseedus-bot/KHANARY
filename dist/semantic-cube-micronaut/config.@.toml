# CUBE-1 — SwarmConsciousness agent registration
# SwarmConsciousness::register_agent(json) reads [agent] as the config object.
# CUBE-1 is UNASSIGNED fold — it underpins all fold lanes via SH projection.
# CSSBinding selector: 🤖[id="CUBE-1"] { --phase: ...; --load: ...; }

[agent]
id          = "CUBE-1"
type        = "semantic_cube"
fold        = "UNASSIGNED"
port        = 3211
endpoint    = "http://localhost:3211"
swarm_role  = "geometry_engine"
priority    = 10
capabilities = ["get_face", "set_face", "sh_projection", "dominant_mu", "optical_wave"]
experts     = ["sh_projector", "shm_reader", "shm_writer"]

[hive]
swarm       = "versions/swarm-v0.1.0"
runtime     = "unified_swarm_runtime"
register_fn = "SwarmConsciousness::register_agent"
css_binding = true

[css]
selector  = "CUBE-1"
phase_var = "--cube-phase"
load_var  = "--cube-load"
role_var  = "--cube-role"

[_start]
lanes  = "native_glyph_engine_cli.exe CUBE-1.xjson"
fold   = "micronaut_xjson.exe CUBE-1.xjson"
worker = "python bots.py"

[_native]
lane_engine = "native_glyph_engine_cli.exe"
lane_role   = "materializes @lanes from CUBE-1.xjson; also owns SHM face read/write (Local\\KuhulGeometricState)"
fold_exe    = "micronaut_xjson.exe"
fold_role   = "XJSON fold processor — reads CUBE-1.xjson, validates fold structure, exposes action surface"
worker      = "bots.py"
worker_role = "Python JSON worker — SH projection + native_glyph_engine_cli subprocess for SHM ops"
xjson       = "CUBE-1.xjson"

[_shm]
name   = "Local\\KuhulGeometricState"
faces  = ["Phi", "Fold", "Gram", "Geodesic", "Projection", "Entropy"]
dtype  = "float32"

[_sh_projection]
basis       = "real spherical harmonics l=0..2"
temperature = 1.0
output      = "dominant_mu name + confidence"

[_optical_wave]
fn      = "SwarmConsciousness::optical_wave(sh_coefficients, frames)"
note    = "CUBE-1 is the entry point for optical wave drives across the swarm"
