# ELIZA-1 — SwarmConsciousness agent registration
# SwarmConsciousness::register_agent(json) reads [agent] as the config object.
# CSSBinding selector: 🤖[id="ELIZA-1"] { --phase: ...; --load: ...; }

[agent]
id          = "ELIZA-1"
type        = "eliza"
fold        = "Chen"
port        = 3168
endpoint    = "http://localhost:3168"
swarm_role  = "reasoning_verifier"
priority    = 8
capabilities = ["verify", "correct", "cube_face_read", "cube_face_write", "escalate"]
experts     = ["reasoning", "tool_router", "correction"]

[hive]
swarm       = "versions/swarm-v0.1.0"
runtime     = "unified_swarm_runtime"
register_fn = "SwarmConsciousness::register_agent"
css_binding = true

[css]
selector    = "ELIZA-1"
phase_var   = "--eliza-phase"
load_var    = "--eliza-load"
role_var    = "--eliza-role"

[_start]
lanes  = "native_glyph_engine_cli.exe ELIZA-1.xjson"
fold   = "micronaut_xjson.exe ELIZA-1.xjson"
worker = "python bots.py"

[_native]
lane_engine = "native_glyph_engine_cli.exe"
lane_role   = "materializes @lanes from ELIZA-1.xjson (agent/skills/experts/runtime/router)"
fold_exe    = "micronaut_xjson.exe"
fold_role   = "XJSON fold processor — reads ELIZA-1.xjson, validates fold structure, exposes action surface"
worker      = "bots.py"
worker_role = "Python JSON worker — Ch'en-fold verifier, calls kuhul-engine :17474"
xjson       = "ELIZA-1.xjson"

[_upstream]
kuhul_port    = 17474
kuhul_mu_name = "eliza"
