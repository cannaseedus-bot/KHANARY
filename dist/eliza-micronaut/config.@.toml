[server]
name = "eliza.@"
port = 3168
s7_base_url = "http://localhost:5000"
s7_role = "consumer"

[_description]
domain = "reasoning_verification"
description = "ELIZA Ch'en-fold verifier — hypothesis checking, correction capture, semantic-cube face integration"
capabilities = ["verify", "correct", "cube_face_read", "cube_face_write", "escalate"]

[_endpoints]
health   = "/health"
verify   = "/verify"
correct  = "/correct"
generate = "/generate"
metrics  = "/metrics"

[_kuhul]
upstream_port  = 17474
µ_name         = "eliza"
generate_path  = "/v1/chat/completions"
health_path    = "/health"

[_cube]
shm_name = "Local\\KuhulGeometricState"
face     = "Projection"

[_start]
lanes  = "native_glyph_engine_cli.exe ELIZA-1.xjson"
fold   = "micronaut_xjson.exe ELIZA-1.xjson"
worker = "python bots.py"

[_native]
lane_engine = "native_glyph_engine_cli.exe"
lane_role   = "materializes @lanes from ELIZA-1.xjson (agent/skills/experts/runtime/router)"
fold_exe    = "micronaut_xjson.exe"
fold_role   = "XJSON fold processor — reads ELIZA-1.xjson, validates fold structure, exposes action surface"
worker      = "bots.py"
worker_role = "Python JSON worker — independent process, dispatch(task, payload) entry point"
xjson       = "ELIZA-1.xjson"

[_shards]
domain          = "reasoning_verification"
compression     = "zstd"
