# ALICE-1 — SwarmConsciousness agent registration
# SwarmConsciousness::register_agent(json) reads [agent] as the config object.
# CSSBinding selector: 🤖[id="ALICE-1"] { --phase: ...; --load: ...; }

[agent]
id          = "ALICE-1"
type        = "alice"
fold        = "Yax"
port        = 3169
endpoint    = "http://localhost:3169"
swarm_role  = "aiml_conversational"
priority    = 5
capabilities = ["chat", "srai", "topic_management", "aiml_pattern_match"]
experts     = ["default", "knowledge", "srai_target"]

[hive]
swarm       = "versions/swarm-v0.1.0"
runtime     = "unified_swarm_runtime"
register_fn = "SwarmConsciousness::register_agent"
css_binding = true

[css]
selector  = "ALICE-1"
phase_var = "--alice-phase"
load_var  = "--alice-load"
role_var  = "--alice-role"

[_start]
lanes  = "native_glyph_engine_cli.exe ALICE-1.xjson"
fold   = "micronaut_xjson.exe ALICE-1.xjson"
worker = "python bots.py"

[_native]
lane_engine = "native_glyph_engine_cli.exe"
lane_role   = "materializes @lanes from ALICE-1.xjson (agent/skills/experts/runtime/router)"
fold_exe    = "micronaut_xjson.exe"
fold_role   = "XJSON fold processor — reads ALICE-1.xjson, validates fold structure, exposes action surface"
worker      = "bots.py"
worker_role = "Python JSON worker — pure AIML trie engine, zero-dependency, no upstream"
xjson       = "ALICE-1.xjson"

[_corpus]
dir            = "micronaut-v4/ELIZA/alice/"
srai_max_depth = 10

[_parent]
µ    = "eliza"
id   = "ELIZA-1"
port = 3168
