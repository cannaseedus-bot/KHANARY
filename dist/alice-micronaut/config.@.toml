# ALICE-1 — SwarmConsciousness agent registration
# SwarmConsciousness::register_agent(json) reads [agent] as the config object.
# CSSBinding selector: 🤖[id="ALICE-1"] { --phase: ...; --load: ...; }

[agent]
id          = "ALICE-1"
type        = "alice"
fold        = "Yax"
port        = 3210
endpoint    = "http://localhost:3210"
swarm_role  = "semantic_resolver"
priority    = 6
capabilities = ["resolve", "bigrams", "trigrams", "coarse_grams", "profile", "classify", "similarity"]
experts     = ["term_resolver", "gram_engine", "domain_classifier", "concept_abstractor"]

[hive]
swarm       = "versions/swarm-v0.1.0"
runtime     = "unified_swarm_runtime"
register_fn = "SwarmConsciousness::register_agent"
css_binding = true

[css]
selector  = "ALICE-1"
phase_var = "--alice-phase"
load_var  = "--alice-load"
role_var  = "--alice-role"

[_start]
lanes  = "native_glyph_engine_cli.exe ALICE-1.xjson"
fold   = "micronaut_xjson.exe ALICE-1.xjson"
worker = "python bots.py"

[_native]
lane_engine = "native_glyph_engine_cli.exe"
lane_role   = "materializes @lanes from ALICE-1.xjson (agent/skills/experts/runtime/router)"
fold_exe    = "micronaut_xjson.exe"
fold_role   = "XJSON fold processor — reads ALICE-1.xjson, validates fold structure, exposes action surface"
worker      = "bots.py"
worker_role = "Python semantic resolver — bigrams/trigrams/coarse grams + khanary stack vocab, zero external calls"
xjson       = "ALICE-1.xjson"

[_gram_engine]
bigram_window   = 2
trigram_window  = 3
coarse_window   = 4
vocab_size      = "~70 khanary stack terms"
concept_classes = 12
similarity_weights = "bigram=0.25 / trigram=0.30 / coarse=0.20 / domain=0.25"

[_parent]
µ    = "eliza"
id   = "ELIZA-1"
port = 3209
