[server]
name = "alice.@"
port = 3169

[_description]
domain = "aiml_conversation"
description = "ALICE Gram-fold AIML symbolic agent — pure KXML pattern/template matching, mp0-mp6 corpus"
capabilities = ["chat", "srai", "topic_management", "pattern_match"]

[_endpoints]
health = "/health"
chat   = "/chat"
reset  = "/reset"
match  = "/match"

[_corpus]
dir              = "micronaut-v4/ELIZA/alice/"
primary          = ["bot.aiml","default.aiml","knowledge.aiml","that.aiml"]
srai_max_depth   = 10
case_sensitive   = false

[_start]
lanes  = "native_glyph_engine_cli.exe ALICE-1.xjson"
fold   = "micronaut_xjson.exe ALICE-1.xjson"
worker = "python bots.py"

[_native]
lane_engine = "native_glyph_engine_cli.exe"
lane_role   = "materializes @lanes from ALICE-1.xjson (agent/skills/experts/runtime/router)"
fold_exe    = "micronaut_xjson.exe"
fold_role   = "XJSON fold processor — reads ALICE-1.xjson, validates fold structure, exposes action surface"
worker      = "bots.py"
worker_role = "Python JSON worker — pure AIML trie engine, dispatch(task, payload) entry point"
xjson       = "ALICE-1.xjson"

[_parent_µ]
name = "eliza"
port = 3168
